<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>OEVRYN Engine</title>
  <desc>Research Intelligence for Medical Image Analysis. Connect papers, open-source code and public updates to explore research directions and PI and team trajectories.</desc>
  <defs>
