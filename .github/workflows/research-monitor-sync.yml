name: Research monitor sync

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research-monitor/**'
      - '.github/workflows/research-monitor-sync.yml'

# Source collection only. Web and data Pages publications are independent.
permissions: {}

concurrency:
  group: medical-research-monitor-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'YazhouZhu19/YazhouZhu19.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/research-monitor/package-lock.json

      - name: Collect, validate, and commit source archives
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # All resets apply only to this disposable Actions checkout. A rejected
          # push is rebuilt from the new main; no force-push or stale JSON rebase.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            export MONITOR_SOURCE_REVISION
            MONITOR_SOURCE_REVISION="$(git rev-parse HEAD)"

            (
              cd tools/research-monitor
              npm ci
              mkdir -p "$RUNNER_TEMP/oevryn-archive-before/papers"
              cp data/papers.json "$RUNNER_TEMP/oevryn-archive-before/papers.json"
              rsync -a --delete data/papers/ "$RUNNER_TEMP/oevryn-archive-before/papers/"
              node --import tsx scripts/snapshot-cli.ts export data/papers.json "$RUNNER_TEMP/research-before-collect.json"
              python3 -c 'import time; print(time.time_ns() // 1000000)' > "$RUNNER_TEMP/research-collect-start-ms"
              collect_exit=0
              npm run collect || collect_exit=$?
              echo "$collect_exit" > "$RUNNER_TEMP/research-collect-exit"
              node --import tsx scripts/snapshot-cli.ts export data/papers.json "$RUNNER_TEMP/research-after-collect.json"
              if [ "$collect_exit" -ne 0 ]; then
                # The CLI intentionally exits 1 after atomically recording a
                # failed attempt for all three sources. Publish those failures,
                # but do not treat an unchanged/invalid snapshot as publishable.
                python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          before_bytes = (temp / 'research-before-collect.json').read_bytes()
          after_bytes = (temp / 'research-after-collect.json').read_bytes()
          before, after = json.loads(before_bytes), json.loads(after_bytes)
          started_ms = int((temp / 'research-collect-start-ms').read_text())

          def require(condition, reason):
              if not condition:
                  raise SystemExit('Collector failed without a publishable fresh error snapshot: ' + reason)

          def timestamp(value):
              require(isinstance(value, str), 'missing timestamp')
              parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              require(parsed.tzinfo is not None, 'timestamp has no timezone')
              return parsed.timestamp() * 1000

          require((temp / 'research-collect-exit').read_text().strip() == '1', 'unexpected exit code')
          require(hashlib.sha256(before_bytes).digest() != hashlib.sha256(after_bytes).digest(), 'snapshot was not replaced')
          require(isinstance(after, dict) and isinstance(before, dict), 'invalid snapshot shape')
          completed_ms = timestamp(after.get('collectedAt'))
          require(completed_ms >= started_ms and after.get('collectedAt') != before.get('collectedAt'), 'stale collection timestamp')
          require(after.get('status') == 'error' and isinstance(after.get('error'), str) and bool(after['error'].strip()), 'missing overall error status')
          require(after.get('lastSuccessfulSync') == before.get('lastSuccessfulSync'), 'failed collection changed last successful sync')
          papers = after.get('papers')
          require(isinstance(papers, list) and after.get('totalStored') == len(papers), 'invalid paper list/count')
          require(all(isinstance(p, dict) and isinstance(p.get('id'), str) and bool(p['id']) and isinstance(p.get('title'), str) for p in papers), 'invalid paper records')
          before_papers = before.get('papers')
          require(isinstance(before_papers, list) and all(isinstance(p, dict) and isinstance(p.get('id'), str) for p in before_papers), 'invalid previous paper library')
          require({p['id'] for p in before_papers}.issubset({p['id'] for p in papers}), 'failed collection removed saved paper IDs')
          sources = {'Europe PMC', 'arXiv', 'medRxiv'}
          errors = after.get('errors')
          require(isinstance(errors, list) and len(errors) == 3, 'missing source errors')
          require(all(isinstance(e, dict) and isinstance(e.get('message'), str) and bool(e['message'].strip()) for e in errors), 'invalid source error')
          require({e.get('source') for e in errors} == sources, 'source errors are incomplete')
          runs = after.get('runs')
          require(isinstance(runs, list), 'missing source runs')
          previous_ids = {r.get('id') for r in before.get('runs', []) if isinstance(r, dict)}
          fresh = [r for r in runs if isinstance(r, dict) and timestamp(r.get('startedAt')) >= started_ms]
          require(len(fresh) == 3 and {r.get('source') for r in fresh} == sources, 'expected three fresh source runs')
          for run in fresh:
              require(isinstance(run.get('id'), str) and bool(run['id']) and run['id'] not in previous_ids, 'source run is not new')
              require(run.get('status') == 'error' and isinstance(run.get('error'), str) and bool(run['error'].strip()), 'source run is not an error')
              require(started_ms <= timestamp(run['startedAt']) <= timestamp(run.get('completedAt')) <= completed_ms, 'invalid source run timestamps')
          print('::warning::All sources failed; archiving fresh failure metadata while retaining the saved library. The job will report failure after saving.')
          PY
              fi
              cp data/research-signals.json "$RUNNER_TEMP/research-signals-before.json"
              signals_started_at="$(node -e 'console.log(new Date().toISOString())')"
              signals_exit=0
              GH_TOKEN="${{ github.token }}" npm run collect:signals || signals_exit=$?
              echo "$signals_exit" > "$RUNNER_TEMP/research-signals-exit"
              node --import tsx scripts/check-signal-collection.ts "$RUNNER_TEMP/research-signals-before.json" data/research-signals.json "$signals_started_at" "$signals_exit"
              npm test
              npm run format:check
              python3 -m unittest discover -s tests -p '*_test.py'
              npm run build
              npm run measure
            )
            collection_failed=false
            if [ "$(cat "$RUNNER_TEMP/research-collect-exit")" -ne 0 ]; then
              collection_failed=true
            fi
            signals_failed=false
            if [ "$(cat "$RUNNER_TEMP/research-signals-exit")" -ne 0 ]; then
              signals_failed=true
            fi

            (cd tools/research-monitor && node --import tsx scripts/compact-archive.ts data/papers.json "$RUNNER_TEMP/oevryn-archive-before/papers.json")
            git add -- tools/research-monitor/data/papers.json tools/research-monitor/data/papers/ tools/research-monitor/data/research-signals.json
            node tools/research-monitor/scripts/check-file-sizes.mjs
            if ! git diff --cached --quiet; then
              git commit -m 'chore: refresh verified research source archives'
            fi
            if git push origin HEAD:main; then
              echo "collection_failed=$collection_failed" >> "$GITHUB_OUTPUT"
              echo "signals_failed=$signals_failed" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not update source archives; no force push attempted.'
              exit 1
            fi
          done

      - name: Report source collection failures
        if: steps.refresh.outputs.collection_failed == 'true' || steps.refresh.outputs.signals_failed == 'true'
        run: |
          echo '::error::Fresh failure metadata was archived while preserving saved records. Inspect source status.'
          exit 1
