    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76e3bf"/><stop offset="1" stop-color="#86d8da"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6e5df" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g fill="none" stroke="#5ac8b0" opacity=".12"><circle cx="1170" cy="590" r="510"/><circle cx="1170" cy="590" r="410"/><circle cx="1170" cy="590" r="310"/></g>
  <rect width="1200" height="7" fill="url(#accent)"/>
  <g transform="translate(58 58)">
