    <text x="130" y="103" fill="#8aaab9" font-size="15">Evidence. Connections. Possibilities.</text>
    <text x="58" y="226" fill="#f5fafc" font-size="64" font-weight="700" letter-spacing="-2">OEVRYN <tspan font-weight="400">Engine</tspan></text>
    <rect x="60" y="260" width="72" height="4" rx="2" fill="#7bdcbc"/>
    <text x="58" y="317" fill="#e3f1f2" font-size="31">Research Intelligence</text>
    <text x="58" y="358" fill="#c2d9e1" font-size="29">for Medical Image Analysis</text>
    <text x="60" y="425" fill="#a8c5cf" font-size="19">Connect the evidence.</text>
    <text x="60" y="455" fill="#a8c5cf" font-size="19">Explore what comes next.</text>
    <text x="60" y="505" fill="#80e1bf" font-size="16" letter-spacing=".5">CHINESE &amp; ENGLISH · OPEN TO EXPLORE</text>
    <rect x="723" y="55" width="414" height="460" rx="22" fill="#f3f8f8"/>
    <text x="751" y="95" fill="#527b82" font-size="14" font-weight="700" letter-spacing="1.8">CONNECTED RESEARCH</text>
    <path d="M751 114h358" stroke="#d5e3e5"/>
    <g fill="#264655" font-size="24">
      <text x="751" y="160" fill="#68a593" font-size="14">01</text><text x="788" y="162">Papers</text>
      <text x="788" y="190" fill="#64818b" font-size="15">Literature &amp; original evidence</text>
      <text x="751" y="238" fill="#68a593" font-size="14">02</text><text x="788" y="240">Open-source code</text>
      <text x="788" y="268" fill="#64818b" font-size="15">Implementations &amp; activity</text>
      <text x="751" y="316" fill="#68a593" font-size="14">03</text><text x="788" y="318">Public updates</text>
      <text x="788" y="346" fill="#64818b" font-size="15">Models &amp; research announcements</text>
    </g>
    <path d="M751 374h358" stroke="#d5e3e5"/>
    <text x="751" y="409" fill="#527b82" font-size="12" font-weight="700" letter-spacing="1.5">EXPLORE WHAT COMES NEXT</text>
