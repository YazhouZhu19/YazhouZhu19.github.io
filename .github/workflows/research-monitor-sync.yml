name: Research monitor sync

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research-monitor/**'
      - '.github/workflows/research-monitor-sync.yml'

# Retain Pages' existing branch source: main / (root).
# The Pages build API needs pages:write; this branch build does not need OIDC.
permissions: {}

concurrency:
  group: medical-research-monitor-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'YazhouZhu19/YazhouZhu19.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/research-monitor/package-lock.json

      - name: Verify existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/research-pages-config.json"
          jq -e '.build_type == "legacy" and .source.branch == "main" and .source.path == "/"' \
            "$RUNNER_TEMP/research-pages-config.json" >/dev/null
          test -f .nojekyll

      - name: Collect, build, and commit only monitor data and output
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # All resets apply only to this disposable Actions checkout. A rejected
          # push is rebuilt from the new main; no force-push or stale JSON rebase.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            export MONITOR_SOURCE_REVISION
            MONITOR_SOURCE_REVISION="$(git rev-parse HEAD)"

            (
              cd tools/research-monitor
              npm ci
              node --import tsx scripts/snapshot-cli.ts export data/papers.json "$RUNNER_TEMP/research-before-collect.json"
              python3 -c 'import time; print(time.time_ns() // 1000000)' > "$RUNNER_TEMP/research-collect-start-ms"
              collect_exit=0
              npm run collect || collect_exit=$?
              echo "$collect_exit" > "$RUNNER_TEMP/research-collect-exit"
              node --import tsx scripts/snapshot-cli.ts export data/papers.json "$RUNNER_TEMP/research-after-collect.json"
              if [ "$collect_exit" -ne 0 ]; then
                # The CLI intentionally exits 1 after atomically recording a
                # failed attempt for all three sources. Publish those failures,
                # but do not treat an unchanged/invalid snapshot as publishable.
                python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          before_bytes = (temp / 'research-before-collect.json').read_bytes()
          after_bytes = (temp / 'research-after-collect.json').read_bytes()
          before, after = json.loads(before_bytes), json.loads(after_bytes)
          started_ms = int((temp / 'research-collect-start-ms').read_text())

          def require(condition, reason):
              if not condition:
                  raise SystemExit('Collector failed without a publishable fresh error snapshot: ' + reason)

          def timestamp(value):
              require(isinstance(value, str), 'missing timestamp')
              parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              require(parsed.tzinfo is not None, 'timestamp has no timezone')
              return parsed.timestamp() * 1000

          require((temp / 'research-collect-exit').read_text().strip() == '1', 'unexpected exit code')
          require(hashlib.sha256(before_bytes).digest() != hashlib.sha256(after_bytes).digest(), 'snapshot was not replaced')
          require(isinstance(after, dict) and isinstance(before, dict), 'invalid snapshot shape')
          completed_ms = timestamp(after.get('collectedAt'))
          require(completed_ms >= started_ms and after.get('collectedAt') != before.get('collectedAt'), 'stale collection timestamp')
          require(after.get('status') == 'error' and isinstance(after.get('error'), str) and bool(after['error'].strip()), 'missing overall error status')
          require(after.get('lastSuccessfulSync') == before.get('lastSuccessfulSync'), 'failed collection changed last successful sync')
          papers = after.get('papers')
          require(isinstance(papers, list) and after.get('totalStored') == len(papers), 'invalid paper list/count')
          require(all(isinstance(p, dict) and isinstance(p.get('id'), str) and bool(p['id']) and isinstance(p.get('title'), str) for p in papers), 'invalid paper records')
          before_papers = before.get('papers')
          require(isinstance(before_papers, list) and all(isinstance(p, dict) and isinstance(p.get('id'), str) for p in before_papers), 'invalid previous paper library')
          require({p['id'] for p in before_papers}.issubset({p['id'] for p in papers}), 'failed collection removed saved paper IDs')
          sources = {'Europe PMC', 'arXiv', 'medRxiv'}
          errors = after.get('errors')
          require(isinstance(errors, list) and len(errors) == 3, 'missing source errors')
          require(all(isinstance(e, dict) and isinstance(e.get('message'), str) and bool(e['message'].strip()) for e in errors), 'invalid source error')
          require({e.get('source') for e in errors} == sources, 'source errors are incomplete')
          runs = after.get('runs')
          require(isinstance(runs, list), 'missing source runs')
          previous_ids = {r.get('id') for r in before.get('runs', []) if isinstance(r, dict)}
          fresh = [r for r in runs if isinstance(r, dict) and timestamp(r.get('startedAt')) >= started_ms]
          require(len(fresh) == 3 and {r.get('source') for r in fresh} == sources, 'expected three fresh source runs')
          for run in fresh:
              require(isinstance(run.get('id'), str) and bool(run['id']) and run['id'] not in previous_ids, 'source run is not new')
              require(run.get('status') == 'error' and isinstance(run.get('error'), str) and bool(run['error'].strip()), 'source run is not an error')
              require(started_ms <= timestamp(run['startedAt']) <= timestamp(run.get('completedAt')) <= completed_ms, 'invalid source run timestamps')
          print('::warning::All sources failed; publishing the fresh failure metadata while retaining the saved library. The job will fail after publication is verified.')
          PY
              fi
              cp data/research-signals.json "$RUNNER_TEMP/research-signals-before.json"
              signals_started_at="$(node -e 'console.log(new Date().toISOString())')"
              signals_exit=0
              GH_TOKEN="${{ github.token }}" npm run collect:signals || signals_exit=$?
              echo "$signals_exit" > "$RUNNER_TEMP/research-signals-exit"
              node --import tsx scripts/check-signal-collection.ts "$RUNNER_TEMP/research-signals-before.json" data/research-signals.json "$signals_started_at" "$signals_exit"
              npm test
              npm run format:check
              python3 -m unittest discover -s tests -p '*_test.py'
              npm run build
              npm run measure
            )
            collection_failed=false
            if [ "$(cat "$RUNNER_TEMP/research-collect-exit")" -ne 0 ]; then
              collection_failed=true
            fi
            signals_failed=false
            if [ "$(cat "$RUNNER_TEMP/research-signals-exit")" -ne 0 ]; then
              signals_failed=true
            fi

            python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools/research-monitor/scripts')
          from snapshot_checks import verify_snapshot
          from signals_checks import verify_signals_snapshot

          dist = Path('tools/research-monitor/dist')
          if dist.is_symlink():
              raise SystemExit('Build output must not be a symbolic link')
          for name in ('index.html', 'en/index.html', 'data/papers.json', 'data/public-papers-v2.json', 'data/public-papers-v3.json', 'data/research-signals.json', 'data/signals-v2/manifest.json'):
              if not (dist / name).is_file():
                  raise SystemExit(f'Missing build output: {name}')
          source_data = Path('tools/research-monitor/data/papers.json').read_bytes()
          legacy_data = (dist / 'data/papers.json').read_bytes()
          public_data = (dist / 'data/public-papers-v2.json').read_bytes()
          compact_data = (dist / 'data/public-papers-v3.json').read_bytes()
          signal_data = (dist / 'data/research-signals.json').read_bytes()
          signal_manifest_data = (dist / 'data/signals-v2/manifest.json').read_bytes()
          if signal_data != Path('tools/research-monitor/data/research-signals.json').read_bytes() or len(signal_data) > 64 * 1024 * 1024:
              raise SystemExit('Public signal snapshot differs from the archive or exceeds the limit')
          if source_data != legacy_data:
              raise SystemExit('Legacy public manifest differs from the v1 archive')
          json.loads(public_data)
          source_snapshot = verify_snapshot(source_data, lambda path: (Path('tools/research-monitor/data') / path).read_bytes(), return_data=True)
          public_snapshot = verify_snapshot(public_data, lambda path: (dist / 'data' / path).read_bytes(), return_data=True)
          compact_snapshot = verify_snapshot(compact_data, lambda path: (dist / 'data' / path).read_bytes(), return_data=True)
          legacy_snapshot = verify_snapshot(legacy_data, lambda path: (dist / 'data' / path).read_bytes(), return_data=True)
          if source_snapshot != public_snapshot or source_snapshot != legacy_snapshot or source_snapshot != compact_snapshot:
              raise SystemExit('Decoded public data differs from collected records or metadata')
          flat_signals = json.loads(signal_data)
          flat_signals['records'].sort(key=lambda record: record['id'])
          split_signals = verify_signals_snapshot(signal_manifest_data, lambda path: (dist / 'data/signals-v2' / path).read_bytes(), return_data=True)
          if split_signals != flat_signals:
              raise SystemExit('Decoded split GitHub/news data differs from collected records or metadata')
          forbidden = {'node_modules', '.git', '.github', '.env', '.env.local'}
          for path in dist.rglob('*'):
              if path.is_symlink() or forbidden.intersection(path.parts):
                  raise SystemExit(f'Unexpected build output: {path}')
              if path.is_file() and (path.name.startswith('.env.') or path.suffix in {'.pem', '.key', '.ts', '.tsx', '.map'}):
                  raise SystemExit(f'Unexpected source/credential output: {path}')
          manifest = {
              'schemaVersion': 1,
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'sourceRevision': os.environ['MONITOR_SOURCE_REVISION'],
              'papersSha256': hashlib.sha256(public_data).hexdigest(),
              'compactPapersSha256': hashlib.sha256(compact_data).hexdigest(),
              'legacyPapersSha256': hashlib.sha256(legacy_data).hexdigest(),
              'signalsSha256': hashlib.sha256(signal_data).hexdigest(),
              'signalsManifestSha256': hashlib.sha256(signal_manifest_data).hexdigest(),
          }
          (dist / 'deployment.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

            staged_site_bytes="$(du -sb tools/research-monitor/dist | cut -f1)"
            if [ "$staged_site_bytes" -gt 800000000 ]; then
              echo "::error::Generated site is $staged_site_bytes bytes, exceeding the 800 MB publication budget. Remove unreferenced generated shards before publishing."
              exit 1
            fi
            test ! -L research-monitor
            mkdir -p research-monitor
            # Delete obsolete assets only within this generated subtree.
            rsync -a --delete tools/research-monitor/dist/ research-monitor/
            published_site_bytes="$(du -sb research-monitor | cut -f1)"
            if [ "$published_site_bytes" -gt 800000000 ]; then
              echo "::error::Publication is $published_site_bytes bytes, exceeding the 800 MB budget; no commit or push will run."
              exit 1
            fi
            echo "Publication apparent size: $published_site_bytes bytes (limit 800000000)." >> "$GITHUB_STEP_SUMMARY"
            git add -- tools/research-monitor/data/papers.json tools/research-monitor/data/papers/ tools/research-monitor/data/research-signals.json research-monitor/

            python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              if path not in ('tools/research-monitor/data/papers.json', 'tools/research-monitor/data/research-signals.json') and not path.startswith(('tools/research-monitor/data/papers/', 'research-monitor/')):
                  raise SystemExit(f'Unexpected staged file: {path}')
          PY

            node tools/research-monitor/scripts/check-file-sizes.mjs

            if ! git diff --cached --quiet; then
              git commit -m 'chore: refresh research monitor data and site'
            fi
            expected_commit="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              echo "commit=$expected_commit" >> "$GITHUB_OUTPUT"
              echo "collection_failed=$collection_failed" >> "$GITHUB_OUTPUT"
              echo "signals_failed=$signals_failed" >> "$GITHUB_OUTPUT"
              break
            fi

            # If the server accepted the push but the response was lost, do not
            # throw away the accepted commit or misreport a failed publication.
            git fetch --depth=1 origin main
            remote_commit="$(git rev-parse origin/main)"
            # A depth-1 checkout cannot reliably answer merge-base queries.
            # GitHub's compare endpoint checks ancestry on the server. A local
            # rejected commit can legitimately be absent remotely (404); an
            # unverified comparison is never success and keeps the rebuild path.
            ancestry_status=""
            if ! ancestry_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$expected_commit...$remote_commit" --jq '.status' 2>/dev/null)"; then
              ancestry_status="unverified"
              echo 'Could not verify remote ancestry; publication is not confirmed and will be rebuilt.'
            fi
            if [ "$ancestry_status" = "ahead" ] || [ "$ancestry_status" = "identical" ]; then
              echo "commit=$expected_commit" >> "$GITHUB_OUTPUT"
              echo "collection_failed=$collection_failed" >> "$GITHUB_OUTPUT"
              echo "signals_failed=$signals_failed" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not update main after 3 attempts; no force-push was attempted.'
              exit 1
            fi
            echo 'main changed concurrently; repeating collection and build from its latest revision.'
          done

      - name: Request Pages build and verify the published revision and data
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.refresh.outputs.commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, 'tools/research-monitor/scripts')
          from snapshot_checks import verify_snapshot, MAX_BYTES
          from signals_checks import verify_signals_snapshot

          expected_commit = os.environ['EXPECTED_COMMIT']
          expected_manifest = json.loads(Path('research-monitor/deployment.json').read_text())
          config = json.loads((Path(os.environ['RUNNER_TEMP']) / 'research-pages-config.json').read_text())
          site_url = config.get('html_url', '')
          if urllib.parse.urlparse(site_url).scheme != 'https':
              raise SystemExit('Pages site did not return an HTTPS public URL')
          monitor_url = site_url.rstrip('/') + '/research-monitor/'

          def api(path, method=None):
              command = ['gh', 'api', path]
              if method:
                  command.extend(['--method', method])
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=30)
              except subprocess.SubprocessError:
                  raise RuntimeError('Pages API request did not complete') from None
              if result.returncode:
                  raise RuntimeError('Pages API request failed')
              return json.loads(result.stdout)

          def pages_build_present(payload, latest):
              # The legacy latest endpoint can describe a cancelled duplicate.
              # Look at every Pages run for this exact commit before requesting.
              runs = payload.get('workflow_runs') if isinstance(payload, dict) else None
              total = payload.get('total_count') if isinstance(payload, dict) else None
              if not isinstance(runs, list) or not isinstance(total, int) or total > len(runs) or not all(isinstance(run, dict) for run in runs):
                  raise RuntimeError('Pages workflow status is incomplete')
              matching = [run for run in runs if run.get('head_sha') == expected_commit and run.get('path') == 'dynamic/pages/pages-build-deployment']
              if any(run.get('status') != 'completed' or run.get('conclusion') == 'success' for run in matching):
                  return True
              return latest.get('commit') == expected_commit and latest.get('status') in ('building', 'built')

          def read_public(path, limit):
              # Public requests contain no token or other credentials.
              query = urllib.parse.urlencode({'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'check': time.time_ns()})
              req = urllib.request.Request(monitor_url + path + '?' + query, headers={'Cache-Control': 'no-cache', 'User-Agent': 'research-monitor-deployment-check'})
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError('Public response exceeded size limit')
              return data

          # A root-homepage push may cause a later Pages commit. It is acceptable
          # only if that commit includes this monitor commit, and the public data
          # and marker below still match this build.
          build_ready = False
          deadline = time.monotonic() + 900
          # Let an automatic Pages run become visible after the push. Only two
          # successful observations of absence can authorize our one fallback POST.
          request_not_before = time.monotonic() + 30
          absent_observations = 0
          build_requested = False
          last_status = None
          while time.monotonic() < deadline:
              request_build = False
              try:
                  build = api(f"repos/{os.environ['GITHUB_REPOSITORY']}/pages/builds/latest")
                  if not isinstance(build, dict):
                      raise RuntimeError('Pages build status is invalid')
                  status, commit = build.get('status'), build.get('commit')
                  if (status, commit) != last_status:
                      print(f'Pages build status={status} commit={commit}', flush=True)
                      last_status = (status, commit)
                  relevant = commit == expected_commit
                  if commit and not relevant:
                      comparison = api(f"repos/{os.environ['GITHUB_REPOSITORY']}/compare/{expected_commit}...{commit}")
                      if not isinstance(comparison, dict) or comparison.get('status') not in ('ahead', 'identical', 'behind', 'diverged'):
                          raise RuntimeError('Pages commit ancestry could not be verified')
                      relevant = comparison['status'] in ('ahead', 'identical')
                  if relevant and status == 'built':
                      build_ready = True
                  if not build_requested:
                      query = urllib.parse.urlencode({'event': 'dynamic', 'head_sha': expected_commit, 'per_page': 100})
                      runs = api(f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?{query}")
                      if pages_build_present(runs, build):
                          absent_observations = 0
                      else:
                          absent_observations += 1
                          request_build = absent_observations >= 2 and time.monotonic() >= request_not_before
              except (RuntimeError, ValueError, OSError, subprocess.CalledProcessError) as error:
                  absent_observations = 0
                  print(f'Waiting for Pages build status ({type(error).__name__}).', flush=True)

              # A duplicate cancelled Pages run can leave the legacy status
              # errored while another run publishes the same commit. Public
              # marker and content checks are the final publication authority.
              try:
                  live_manifest = json.loads(read_public('deployment.json', 65536))
                  if live_manifest == expected_manifest:
                      build_ready = True
                      live_data = read_public('data/public-papers-v2.json', MAX_BYTES)
                      json.loads(live_data)
                      if hashlib.sha256(live_data).hexdigest() == expected_manifest['papersSha256']:
                          total = verify_snapshot(live_data, lambda path: read_public('data/' + path, MAX_BYTES))
                          compact_data = read_public('data/public-papers-v3.json', MAX_BYTES)
                          if hashlib.sha256(compact_data).hexdigest() != expected_manifest['compactPapersSha256']:
                              raise RuntimeError('Compact public manifest does not match this deployment')
                          if verify_snapshot(compact_data, lambda path: read_public('data/' + path, MAX_BYTES)) != total:
                              raise RuntimeError('Compact and v2 public paper counts differ')
                          legacy_data = read_public('data/papers.json', MAX_BYTES)
                          if hashlib.sha256(legacy_data).hexdigest() != expected_manifest['legacyPapersSha256']:
                              raise RuntimeError('Legacy public manifest does not match this deployment')
                          if verify_snapshot(legacy_data, lambda path: read_public('data/' + path, MAX_BYTES)) != total:
                              raise RuntimeError('Legacy and current public paper counts differ')
                          signal_data = read_public('data/research-signals.json', 64 * 1024 * 1024)
                          if hashlib.sha256(signal_data).hexdigest() != expected_manifest['signalsSha256']:
                              raise RuntimeError('Public GitHub/news data does not match this deployment')
                          split_data = read_public('data/signals-v2/manifest.json', MAX_BYTES)
                          if hashlib.sha256(split_data).hexdigest() != expected_manifest['signalsManifestSha256']:
                              raise RuntimeError('Split GitHub/news manifest does not match this deployment')
                          split_counts = verify_signals_snapshot(split_data, lambda path: read_public('data/signals-v2/' + path, MAX_BYTES))
                          flat_records = json.loads(signal_data)['records']
                          if split_counts != {kind: sum(record['kind'] == kind for record in flat_records) for kind in ('github', 'news')}:
                              raise RuntimeError('Split and legacy GitHub/news counts differ')
                          for route in ('', 'en/'):
                              if b'<html' not in read_public(route, 2 * 1024 * 1024).lower():
                                  raise RuntimeError('Published route did not return HTML')
                          print(f'Published routes, build marker, v1/v2/v3 paper snapshots ({total} papers), and legacy/split GitHub/news snapshots verified.', flush=True)
                          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                              summary.write(f'Published and verified: {monitor_url}\n\nCommit: `{expected_commit}`\n\nPublic data SHA-256: `{expected_manifest["papersSha256"]}`\n')
                          break
              except (RuntimeError, ValueError, OSError, subprocess.CalledProcessError) as error:
                  # Transient API/CDN errors retry; no access-token values or
                  # request headers are printed.
                  print(f'Waiting for Pages publication ({type(error).__name__}).', flush=True)
              if request_build:
                  # Set this before POST: an ambiguous network response must not
                  # cause another competing build. Public verification still runs.
                  build_requested = True
                  try:
                      api(f"repos/{os.environ['GITHUB_REPOSITORY']}/pages/builds", method='POST')
                      print('Requested one Pages fallback build; awaiting public verification.', flush=True)
                  except (RuntimeError, ValueError, OSError) as error:
                      print(f'Pages fallback request outcome unavailable ({type(error).__name__}); it will not be repeated.', flush=True)
              time.sleep(15)
          else:
              stage = 'public data verification' if build_ready else 'Pages build'
              raise SystemExit(f'Timed out waiting for {stage}; publication is not verified')
          PY

      - name: Mark all-source collection failure after publishing its status
        if: steps.refresh.outputs.collection_failed == 'true'
        run: |
          echo '::error::All three sources failed. The site now displays the verified fresh failure status and retains its saved library.'
          echo 'Collection failed for all three sources; the updated error status was published and verified. The saved library remains available.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Mark signal collection failure after publishing its status
        if: always() && steps.refresh.outputs.signals_failed == 'true'
        run: |
          echo '::error::GitHub and Google News collection failed. The signal snapshot retains existing records and records source errors.'
          exit 1
