<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Medical Image Research Monitor</title>
  <desc>A public dashboard for papers and preprints across ten medical imaging research interests. Europe PMC, arXiv and medRxiv. Available in Chinese and English.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2131"/><stop offset="1" stop-color="#173b46"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76e3bf"/><stop offset="1" stop-color="#86d8da"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#5ac8b0" opacity="0.1"><circle cx="1150" cy="610" r="520"/><circle cx="1150" cy="610" r="430"/><circle cx="1150" cy="610" r="340"/></g>
  <rect x="0" y="0" width="1200" height="7" fill="url(#accent)"/>
  <g transform="translate(58 58)">
    <rect width="52" height="52" rx="14" fill="#244c4c"/>
    <path d="M12 21v-9h9m10 0h9v9M12 31v9h9m10 0h9v-9" stroke="#80e1bf" stroke-width="2.6" fill="none"/>
    <circle cx="26" cy="26" r="6" fill="#80e1bf"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="130" y="80" fill="#d2e8e9" font-size="16" font-weight="700" letter-spacing="2.1">OPEN RESEARCH DASHBOARD</text>
    <text x="130" y="103" fill="#8aaab9" font-size="15">Papers. Preprints. Research connections.</text>
    <text x="58" y="213" fill="#f5fafc" font-size="64" font-weight="700" letter-spacing="-2">Medical Image</text>
    <text x="58" y="287" fill="#f5fafc" font-size="64" font-weight="700" letter-spacing="-2">Research Monitor</text>
    <rect x="60" y="320" width="72" height="4" rx="2" fill="#7bdcbc"/>
    <text x="58" y="367" fill="#c2d9e1" font-size="26">Research discovery, in one place.</text>
    <text x="60" y="413" fill="#e3f1f2" font-size="21"><tspan fill="#80e1bf" font-weight="700">10</tspan> research interests · <tspan fill="#80e1bf" font-weight="700">3</tspan> literature sources</text>
    <text x="60" y="447" fill="#b7ced8" font-size="21">Chinese &amp; English · Free to explore</text>
    <g fill="#203e4b" stroke="#365462"><rect x="58" y="474" width="153" height="39" rx="9"/><rect x="222" y="474" width="90" height="39" rx="9"/><rect x="323" y="474" width="117" height="39" rx="9"/></g>
    <g fill="#dcecee" font-size="17" text-anchor="middle"><text x="134" y="500">Europe PMC</text><text x="267" y="500">arXiv</text><text x="381" y="500">medRxiv</text></g>
    <path d="M59 550h1082" stroke="#40606d" opacity="0.7"/>
    <text x="59" y="590" fill="#a4c4cf" font-size="20">yazhouzhu19.github.io/research-monitor</text>
    <text x="1141" y="590" text-anchor="end" fill="#87e0c1" font-size="19">Explore the field ↗</text>
    <rect x="729" y="61" width="414" height="460" rx="22" fill="#061a26" opacity="0.28"/>
    <rect x="723" y="55" width="414" height="460" rx="22" fill="#f3f8f8"/>
    <text x="751" y="93" fill="#527b82" font-size="14" font-weight="700" letter-spacing="1.8">10 RESEARCH INTERESTS</text>
    <path d="M751 110h358" stroke="#d5e3e5"/>
    <g font-size="18" fill="#264655">
      <g><text x="751" y="143" fill="#68a593" font-size="14">01</text><text x="783" y="143">Organ &amp; lesion segmentation</text></g>
      <g><text x="751" y="177" fill="#68a593" font-size="14">02</text><text x="783" y="177">Human-in-the-loop diagnosis</text></g>
      <g><text x="751" y="211" fill="#68a593" font-size="14">03</text><text x="783" y="211">Detection &amp; classification</text></g>
      <g><text x="751" y="245" fill="#68a593" font-size="14">04</text><text x="783" y="245">Reconstruction &amp; synthesis</text></g>
      <g><text x="751" y="279" fill="#68a593" font-size="14">05</text><text x="783" y="279">Registration &amp; tracking</text></g>
      <g><text x="751" y="313" fill="#68a593" font-size="14">06</text><text x="783" y="313">Radiomics &amp; biomarkers</text></g>
      <g><text x="751" y="347" fill="#68a593" font-size="14">07</text><text x="783" y="347">Prognosis &amp; treatment response</text></g>
      <g><text x="751" y="381" fill="#68a593" font-size="14">08</text><text x="783" y="381">Image–language understanding</text></g>
      <g><text x="751" y="415" fill="#68a593" font-size="14">09</text><text x="783" y="415">Treatment planning &amp; guidance</text></g>
      <g><text x="751" y="449" fill="#68a593" font-size="14">10</text><text x="783" y="449">Medical imaging foundation models</text></g>
    </g>
    <rect x="751" y="470" width="204" height="26" rx="13" fill="#dceee8"/>
    <circle cx="766" cy="483" r="3.5" fill="#30876c"/>
    <text x="778" y="488" fill="#367465" font-size="13">JOURNALS + PREPRINTS</text>
  </g>
</svg>
