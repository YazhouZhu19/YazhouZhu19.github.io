name: OEVRYN live release audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/research-monitor
        shell: bash
    env:
      OEVRYN_WEB_REVISION: 0fc97ba3a7ce732eff52955eb7b87345c46f89cb
      OEVRYN_DATA_REVISION: ec27c17032090b8fbe20250eb0a8bc3981cd5ff2
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/research-monitor/package-lock.json

      - name: Prepare diagnostic output
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oevryn-online-audit"
          echo "OEVRYN_AUDIT_DIR=$RUNNER_TEMP/oevryn-online-audit" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$OEVRYN_AUDIT_DIR/npm-ci.log"

      - name: Install Chromium for live checks
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "$OEVRYN_AUDIT_DIR/chromium-install.log"

      - name: Verify deployed releases and live browser flows
        run: |
          set -euo pipefail
          node --import tsx e2e/live-release-audit.ts "$OEVRYN_WEB_REVISION" "$OEVRYN_DATA_REVISION" e2e/live-audit-expected.json 2>&1 | tee "$OEVRYN_AUDIT_DIR/live-release-audit.log"

      - name: Retain live reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oevryn-live-release-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oevryn-online-audit/
          if-no-files-found: warn
          retention-days: 7
