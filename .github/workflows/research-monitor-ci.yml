name: Research monitor CI

on:
  pull_request:
    paths:
      - 'tools/research-monitor/**'
      - '.github/workflows/research-monitor-ci.yml'
      - '.github/workflows/research-monitor-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-monitor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/research-monitor
        shell: bash
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/research-monitor/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test and check formatting
        run: |
          npm test
          npm run format:check
          python3 -m unittest discover -s tests -p '*_test.py'

      - name: Build and enforce resource budgets
        run: |
          npm run build
          npm run measure
          site_bytes="$(du -sb dist | cut -f1)"
          if [ "$site_bytes" -gt 800000000 ]; then
            echo "::error::Generated site is $site_bytes bytes, exceeding the 800 MB publication budget."
            exit 1
          fi
          echo "Publication apparent size: $site_bytes bytes (limit 800000000)." >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate frozen relevance evidence
        id: evaluate
        run: node --import tsx scripts/eval-classifier.ts

      - name: Publish evaluation job summary
        if: always() && steps.evaluate.outcome == 'success'
        run: |
          if [ -f eval/report.md ]; then
            {
              echo '## Frozen-evidence evaluation'
              echo
              echo 'The report identifies its label status. AI-assisted or provisional labels do not satisfy the maintainer-reviewed gold gate.'
              echo
              cat eval/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
